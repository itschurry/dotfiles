"$schema" = 'https://starship.rs/config-schema.json'

# Pure 구성에 TokyoNight 색상과 개발 환경 정보를 적용
add_newline = true
continuation_prompt = '[..](#8892b0) '
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$line_break\
$character"""
right_format = ''

[character]
success_symbol = '[❯](#bb9af7)'
error_symbol = '[❯](#f7768e)'
vimcmd_symbol = '[❮](#9ece6a)'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#7aa2f7'
read_only = ' ro'
read_only_style = '#f7768e'
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = '[$branch(:$remote_branch)]($style) '
style = '#8892b0'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = '#e0af68'

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = '#e0af68'
conflicted = '=${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↕↑${ahead_count}↓${behind_count} '
up_to_date = ''
untracked = '?${count} '
stashed = '$${count} '
modified = '!${count} '
staged = '+${count} '
renamed = 'r${count} '
deleted = 'x${count} '

[python]
format = '[$virtualenv]($style) '
style = '#9ece6a'
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ['VIRTUAL_ENV']

[username]
format = '[$user]($style) '
style_user = '#8892b0'
style_root = '#f7768e'
show_always = false

[hostname]
format = '[$hostname]($style) '
style = '#8892b0'
ssh_only = true
ssh_symbol = ''
