"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500
scan_timeout = 100
continuation_prompt = '[..](dimmed white) '
format = """
$username\
$hostname\
$directory\
$python\
$git_branch\
${custom.git_clean}\
$git_status\
$line_break\
$character"""
right_format = "$cmd_duration$jobs$status$time"

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
disabled = true

[azure]
format = '\[[$symbol($subscription)]($style)\]'
disabled = true

[battery]
format = '\[[$symbol$percentage]($style)\]'

[buf]
format = '\[[$symbol($version)]($style)\]'

[bun]
format = '\[[$symbol($version)]($style)\]'

[c]
format = '\[[$symbol($version(-$name))]($style)\]'

[cmake]
format = '\[[$symbol($version)]($style)\]'

[character]
success_symbol = '[❯](bold #9ece6a)'
error_symbol = '[❯](bold #f7768e)'
vimcmd_symbol = '[❮](bold #e0af68)'

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
style = '#e0af68'

[custom.git_clean]
command = 'printf ✓'
when = 'test -z "$(git status --porcelain)"'
require_repo = true
ignore_timeout = true
format = '\[[$output]($style)\]'
style = '#9ece6a'

[cobol]
format = '\[[$symbol($version)]($style)\]'

[conda]
format = '\[[$symbol$environment]($style)\]'

[container]
format = '\[[$symbol \[$name\]]($style)\]'

[cpp]
format = '\[[$symbol($version(-$name))]($style)\]'

[crystal]
format = '\[[$symbol($version)]($style)\]'

[daml]
format = '\[[$symbol($version)]($style)\]'

[dart]
format = '\[[$symbol($version)]($style)\]'

[deno]
format = '\[[$symbol($version)]($style)\]'

[direnv]
format = '\[[$symbol$loaded/$allowed]($style)\]'

[directory]
style = 'bold #7aa2f7'
read_only_style = '#f7768e'
truncation_length = 0
truncate_to_repo = false

[docker_context]
format = '\[[$symbol$context]($style)\]'
style = '#7aa2f7'

[dotnet]
format = '\[[$symbol($version)(🎯 $tfm)]($style)\]'

[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\]'

[elm]
format = '\[[$symbol($version)]($style)\]'

[erlang]
format = '\[[$symbol($version)]($style)\]'

[fennel]
format = '\[[$symbol($version)]($style)\]'

[fortran]
format = '\[[$symbol($version)]($style)\]'

[fossil_branch]
format = '\[[$symbol$branch]($style)\]'

[fossil_metrics]
format = '\[[+$added]($added_style)\]\[[-$deleted]($deleted_style)\]'

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
disabled = true

[git_branch]
format = '\[[$symbol$branch(:$remote_branch)]($style)\]'
style = '#bb9af7'

[git_commit]
format = '\[[\($hash$tag\)]($style)\]'

[git_metrics]
format = '\[[+$added]($added_style)\]\[[-$deleted]($deleted_style)\]'

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = '#f7768e'
conflicted = '=${count}'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕↑${ahead_count}↓${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = 'x${count}'

[gleam]
format = '\[[$symbol($version)]($style)\]'

[golang]
format = '\[[$symbol($version)]($style)\]'
style = '#7dcfff'

[gradle]
format = '\[[$symbol($version)]($style)\]'

[guix_shell]
format = '\[[$symbol]($style)\]'

[haskell]
format = '\[[$symbol($version)]($style)\]'

[haxe]
format = '\[[$symbol($version)]($style)\]'

[helm]
format = '\[[$symbol($version)]($style)\]'

[hg_branch]
format = '\[[$symbol$branch]($style)\]'

[hostname]
format = '\[[$ssh_symbol($hostname)]($style)\] '
style = '#bb9af7'

[java]
format = '\[[$symbol($version)]($style)\]'

[jobs]
format = '\[[$symbol$number]($style)\]'
style = '#7aa2f7'

[julia]
format = '\[[$symbol($version)]($style)\]'

[kotlin]
format = '\[[$symbol($version)]($style)\]'

[kubernetes]
