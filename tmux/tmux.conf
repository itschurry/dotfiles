# 256컬러 지원 활성화
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# 이스케이프 시퀀스 통과 허용
set -g allow-passthrough on

# Scrolling
setw -g mouse on

# Start windows and panes at 0
set -g base-index 0
setw -g pane-base-index 0

# Renumber windows
set-option -g renumber-windows on

# 테마 없이 색만 살짝
set -g status-style "bg=default,fg=white"
set -g window-status-current-style "fg=green,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=green"

# Statusline location
set -g status-position bottom

# Statusline
set -g status-left-length 20
set -g status-right "%I:%M %p, %y-%b-%d, %a"

# sync system clipboard
set-option -g set-clipboard on
# vi style copy mode
setw -g mode-keys vi

set -g extended-keys on
set -as terminal-features ',*:extkeys'
bind-key -n S-Enter send-keys Escape "[13;2u"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sed 's/^ *[0-9]\\+ *$//; s/^ *[0-9]\\+ //' | xclip -selection clipboard"

unbind C-a
set -g prefix C-b
bind-key C-b send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded..."
set-option -sg escape-time 10

unbind n
unbind p
unbind x
bind-key p kill-pane
bind-key x next-window
bind-key z previous-window

unbind %
unbind \"
bind-key v split-window -h
bind-key s split-window -v

unbind right
unbind left
unbind up
unbind down
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# C-h/j/k/l은 셸/터미널 기본 동작 용도로 비워둔다.
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l
unbind-key -n C-Left
unbind-key -n C-Down
unbind-key -n C-Up
unbind-key -n C-Right

# TPM 설정
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @vim_navigator_mapping_left 'M-h'
set -g @vim_navigator_mapping_down 'M-j'
set -g @vim_navigator_mapping_up 'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_prefix_mapping_clear_screen ''
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'wfxr/tmux-fzf-url'

# TPM 초기화
run '~/.tmux/plugins/tpm/tpm'
