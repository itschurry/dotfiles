# -----------------------------------------------------------------------------
# 터미널 / 호환성
# -----------------------------------------------------------------------------
# true color와 tmux 전용 terminfo를 사용한다.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Neovim 등에서 확장 키와 escape sequence를 제대로 넘긴다.
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features ',*:extkeys'
bind-key -n S-Enter send-keys Escape "[13;2u"

# 키 입력 지연을 줄인다.
set-option -sg escape-time 10


# -----------------------------------------------------------------------------
# 기본 동작
# -----------------------------------------------------------------------------
# 마우스 스크롤/선택/pane 조작을 켠다.
setw -g mouse on

# window/pane 번호는 0부터 시작한다.
set -g base-index 0
setw -g pane-base-index 0

# window를 닫으면 번호를 자동으로 다시 정렬한다.
set-option -g renumber-windows on

# tmux와 시스템 클립보드를 연동한다.
set-option -g set-clipboard on

# copy mode는 vi 키맵을 쓴다.
setw -g mode-keys vi


# -----------------------------------------------------------------------------
# 색상 / status line
# -----------------------------------------------------------------------------
# 테마 플러그인 없이 상태 정보를 읽기 쉽게 조정한다.
set -g status-style "bg=default,fg=colour250"
set -g status-justify left
set -g window-status-style "fg=colour244"
set -g window-status-current-style "fg=colour46,bold"

# pane 구분선은 단일 선으로 두고 색만 낮춰 얇게 보이게 한다.
set -g pane-border-lines single
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour245"

# status line은 하단에 두고 tmux를 주 작업 UI로 쓰기 좋은 정보만 표시한다.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 80
set -g status-right-length 120
set -g status-left "#[fg=colour46,bold]#S #[fg=colour226]#{?client_prefix,PREFIX ,}#[fg=colour39]#{?pane_in_mode,COPY ,}#[fg=colour244]#{b:pane_current_path}"
set -g status-right "#[fg=colour46]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) #[fg=colour214]#(pmset -g batt | awk 'NR==2 {print $3}' | tr -d ';') #[fg=colour39]%H:%M #[fg=colour244]%m-%d"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[reverse] #I:#W "


# -----------------------------------------------------------------------------
# Prefix / 설정 리로드
# -----------------------------------------------------------------------------
# 기본 prefix인 C-b를 명시적으로 사용한다.
unbind C-a
set -g prefix C-b
bind-key C-b send-prefix

# prefix + r 로 설정을 다시 읽는다.
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded..."


# -----------------------------------------------------------------------------
# Window / pane 조작
# -----------------------------------------------------------------------------
# window 이동: prefix + x/z
unbind n
unbind p
unbind x
bind-key x next-window
bind-key z previous-window

# pane 종료: prefix + p
bind-key p kill-pane

# split 생성: prefix + v/s
unbind %
unbind \"
bind-key v split-window -h
bind-key s split-window -v

# pane 이동: prefix + h/j/k/l
unbind right
unbind left
unbind up
unbind down
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# pane 크기 조절: prefix + C-h/j/k/l
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5


# -----------------------------------------------------------------------------
# Copy mode / 클립보드
# -----------------------------------------------------------------------------
# y로 선택 영역을 xclip에 복사한다.
# sed는 복사한 라인 앞의 줄 번호만 제거한다.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sed 's/^ *[0-9]\\+ *$//; s/^ *[0-9]\\+ //' | xclip -selection clipboard"


# -----------------------------------------------------------------------------
# Neovim / tmux navigator
# -----------------------------------------------------------------------------
# C-h/j/k/l은 셸과 터미널 기본 동작으로 남긴다.
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l

# 이전에 쓰던 C-Arrow navigator 바인딩이 남아 있으면 지운다.
unbind-key -n C-Left
unbind-key -n C-Down
unbind-key -n C-Up
unbind-key -n C-Right

# Neovim split과 tmux pane 이동은 Alt-h/j/k/l로 통일한다.
set -g @vim_navigator_mapping_left 'M-h'
set -g @vim_navigator_mapping_down 'M-j'
set -g @vim_navigator_mapping_up 'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_prefix_mapping_clear_screen ''


# -----------------------------------------------------------------------------
# TPM 플러그인
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'wfxr/tmux-fzf-url'

# TPM 초기화는 항상 마지막에 둔다.
run '~/.tmux/plugins/tpm/tpm'
